<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="Yahia Rachek — Full-Stack Engineer, AI Orchestration Engineer and PERN Architect">
<title>Yahia Rachek — Full-Stack Engineer, AI Orchestration Engineer and PERN Architect</title>
<style>
  :root { --p:#1d1d1f; --s:#6e6e73; --t:#86868b; --bg:#fbfbfd; --glass:rgba(255,255,255,0.62);
           --edge:rgba(255,255,255,0.95); --edge2:rgba(0,0,0,0.06); --hair:rgba(0,0,0,0.08);
           --chip:rgba(255,255,255,0.7); --blob:0.55; --frost:0.62; --tint:0.30; --sheen:0.35; }
  @media (prefers-color-scheme: dark) {
    :root { --p:#f5f5f7; --s:#a1a1a6; --t:#8e8e93; --bg:#0d1117; --glass:rgba(255,255,255,0.045);
             --edge:rgba(255,255,255,0.32); --edge2:rgba(255,255,255,0.04); --hair:rgba(255,255,255,0.09);
             --chip:rgba(255,255,255,0.08); --blob:0.30; --frost:0.30; --tint:0.22; --sheen:0.07; }
  }
  text { font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  .p { fill:var(--p); } .s { fill:var(--s); } .t { fill:var(--t); }
  .bg { fill:var(--bg); }
  .glass { fill:var(--glass); }
  .edge { fill:none; stroke:url(#edge); stroke-width:1.2; }
  .hair { stroke:var(--hair); stroke-width:1; }
  .chip { fill:var(--chip); stroke:var(--edge2); stroke-width:1; }
  .blobs { opacity:var(--blob); } .tint { opacity:var(--tint); }
  .rim { fill:none; stroke:var(--hair); stroke-width:1; }
  .frost { fill:var(--glass); opacity:var(--frost); }
  .eyebrow { font-size:13px; font-weight:600; letter-spacing:2.6px; }
  .drift1 { animation: d1 22s ease-in-out infinite alternate; }
  .drift2 { animation: d2 28s ease-in-out infinite alternate; }
  .drift3 { animation: d3 25s ease-in-out infinite alternate; }
  @keyframes d1 { to { transform: translate(80px, 30px); } }
  @keyframes d2 { to { transform: translate(-90px, -20px); } }
  @keyframes d3 { to { transform: translate(40px, -40px); } }
  @media (prefers-reduced-motion: reduce) { .drift1, .drift2, .drift3 { animation:none; } }
</style>
<defs>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
  <filter id="softer" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="110"/></filter>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
    <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000" flood-opacity="0.10"/>
  </filter>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="var(--edge)"/>
    <stop offset="0.45" stop-color="var(--edge2)"/>
    <stop offset="1" stop-color="var(--edge)" stop-opacity="0.55"/>
  </linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" style="stop-opacity:var(--sheen)"/>
    <stop offset="0.35" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="frame"><rect width="1200" height="470" rx="32"/></clipPath>
</defs>
<g clip-path="url(#frame)"><rect width="1200" height="470" class="bg"/><g class="blobs" filter="url(#soft)" transform="translate(0 0)"><circle class="drift1" cx="216" cy="118" r="360" fill="#7ab8ff"/><circle class="drift2" cx="960" cy="141" r="336" fill="#c3a6ff"/><circle class="drift3" cx="744" cy="446" r="312" fill="#f7b8d2"/><circle class="drift2" cx="120" cy="446" r="264" fill="#8fe3d2"/></g></g>

  <g filter="url(#shadow)"><rect x="48" y="48" width="1104" height="374" rx="34" class="glass"/></g>
  <rect x="48" y="48" width="1104" height="374" rx="34" fill="url(#sheen)"/>
  <rect x="48.5" y="48.5" width="1103" height="373" rx="34" class="rim"/>
  <rect x="48.6" y="48.6" width="1102.8" height="372.8" rx="34" class="edge"/>
  <text x="110" y="142" class="eyebrow t">FULL-STACK ENGINEER  ·  AI ORCHESTRATION  ·  PERN ARCHITECT</text>
  <text x="106" y="228" font-size="78" font-weight="600" letter-spacing="-2.6" class="p">Yahia Rachek</text>
  <text x="110" y="282" font-size="22" font-weight="400" class="s">Enterprise ERP, industrial traceability and agentic AI —</text>
  <text x="110" y="312" font-size="22" font-weight="400" class="s">designed and built end to end.</text>
<rect x="110" y="350" width="114" height="34" rx="17.0" class="chip"/><text x="167" y="372.0" text-anchor="middle" font-size="14" font-weight="500" class="p">PostgreSQL</text><rect x="234.0" y="350" width="89" height="34" rx="17.0" class="chip"/><text x="278" y="372.0" text-anchor="middle" font-size="14" font-weight="500" class="p">Express</text><rect x="332.8" y="350" width="72" height="34" rx="17.0" class="chip"/><text x="369" y="372.0" text-anchor="middle" font-size="14" font-weight="500" class="p">React</text><rect x="414.8" y="350" width="89" height="34" rx="17.0" class="chip"/><text x="459" y="372.0" text-anchor="middle" font-size="14" font-weight="500" class="p">Node.js</text><rect x="513.6" y="350" width="114" height="34" rx="17.0" class="chip"/><text x="571" y="372.0" text-anchor="middle" font-size="14" font-weight="500" class="p">TypeScript</text><rect x="637.6" y="350" width="80" height="34" rx="17.0" class="chip"/><text x="678" y="372.0" text-anchor="middle" font-size="14" font-weight="500" class="p">Claude</text>
  <g transform="translate(985 228)">
    <circle r="96" fill="url(#orbFill)"/>
    <circle r="96" fill="url(#sheen)"/>
    <circle r="95.4" fill="none" stroke="url(#edge)" stroke-width="1.4"/>
    <ellipse cx="-30" cy="-52" rx="44" ry="16" fill="#fff" opacity="0.35" transform="rotate(-24)"/>
    <text y="16" text-anchor="middle" font-size="46" font-weight="600" letter-spacing="-1" class="p">YR</text>
  </g>
  <defs>
    <radialGradient id="orbFill" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#c3a6ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7ab8ff" stop-opacity="0.28"/>
    </radialGradient>
  </defs>
</svg>
