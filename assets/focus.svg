<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="546" viewBox="0 0 1200 546" role="img" aria-label="Areas of focus: full-stack PERN engineering, AI engineering and LLM orchestration, software architecture and consulting; enterprise systems, AI-powered apps, developer tooling and open source.">
<title>Areas of focus: full-stack PERN engineering, AI engineering and LLM orchestration, software architecture and consulting; enterprise systems, AI-powered apps, developer tooling and open source.</title>
<style>
  :root { --p:#1d1d1f; --s:#6e6e73; --t:#86868b; --bg:#fbfbfd; --glass:rgba(255,255,255,0.62);
           --edge:rgba(255,255,255,0.95); --edge2:rgba(0,0,0,0.06); --hair:rgba(0,0,0,0.08);
           --chip:rgba(255,255,255,0.7); --blob:0.55; --frost:0.62; --tint:0.30; --sheen:0.35; }
  @media (prefers-color-scheme: dark) {
    :root { --p:#f5f5f7; --s:#a1a1a6; --t:#8e8e93; --bg:#0d1117; --glass:rgba(255,255,255,0.045);
             --edge:rgba(255,255,255,0.32); --edge2:rgba(255,255,255,0.04); --hair:rgba(255,255,255,0.09);
             --chip:rgba(255,255,255,0.08); --blob:0.30; --frost:0.30; --tint:0.22; --sheen:0.07; }
  }
  text { font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  .p { fill:var(--p); } .s { fill:var(--s); } .t { fill:var(--t); }
  .bg { fill:var(--bg); }
  .glass { fill:var(--glass); }
  .edge { fill:none; stroke:url(#edge); stroke-width:1.2; }
  .hair { stroke:var(--hair); stroke-width:1; }
  .chip { fill:var(--chip); stroke:var(--edge2); stroke-width:1; }
  .blobs { opacity:var(--blob); } .tint { opacity:var(--tint); }
  .rim { fill:none; stroke:var(--hair); stroke-width:1; }
  .frost { fill:var(--glass); opacity:var(--frost); }
  .eyebrow { font-size:13px; font-weight:600; letter-spacing:2.6px; }
  .drift1 { animation: d1 22s ease-in-out infinite alternate; }
  .drift2 { animation: d2 28s ease-in-out infinite alternate; }
  .drift3 { animation: d3 25s ease-in-out infinite alternate; }
  @keyframes d1 { to { transform: translate(80px, 30px); } }
  @keyframes d2 { to { transform: translate(-90px, -20px); } }
  @keyframes d3 { to { transform: translate(40px, -40px); } }
  @media (prefers-reduced-motion: reduce) { .drift1, .drift2, .drift3 { animation:none; } }
</style>
<defs>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
  <filter id="softer" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="110"/></filter>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
    <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000" flood-opacity="0.10"/>
  </filter>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="var(--edge)"/>
    <stop offset="0.45" stop-color="var(--edge2)"/>
    <stop offset="1" stop-color="var(--edge)" stop-opacity="0.55"/>
  </linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" style="stop-opacity:var(--sheen)"/>
    <stop offset="0.35" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="frame"><rect width="1200" height="546" rx="32"/></clipPath>
</defs>

<text x="600" y="78" text-anchor="middle" class="eyebrow t">AREAS OF FOCUS</text>
  <g filter="url(#shadow)"><rect x="48.0" y="110" width="540.0" height="396" rx="28" class="glass"/></g><clipPath id="g4"><rect x="48.0" y="110" width="540.0" height="396" rx="28"/></clipPath><g clip-path="url(#g4)"><g class="tint" filter="url(#softer)" transform="translate(48.0 110)"><circle class="drift1" cx="97" cy="99" r="146" fill="#7ab8ff"/><circle class="drift2" cx="432" cy="119" r="136" fill="#c3a6ff"/><circle class="drift3" cx="335" cy="376" r="126" fill="#f7b8d2"/><circle class="drift2" cx="54" cy="376" r="107" fill="#8fe3d2"/></g></g>
  <rect x="48.0" y="110" width="540.0" height="396" rx="28" fill="url(#sheen)"/>
  <rect x="48.5" y="110.5" width="539.0" height="395" rx="28" class="rim"/>
  <rect x="48.6" y="110.6" width="538.8" height="394.8" rx="28" class="edge"/><text x="84.0" y="162" font-size="22" font-weight="600" letter-spacing="-0.4" class="p">Roles I build in</text><line x1="84.0" y1="182" x2="552.0" y2="182" class="hair"/><text x="84.0" y="208" font-size="17" font-weight="600" class="p">Full-Stack / PERN Engineering</text><text x="84.0" y="232" font-size="15" class="s">Scalable products</text><line x1="84.0" y1="256" x2="552.0" y2="256" class="hair"/><text x="84.0" y="282" font-size="17" font-weight="600" class="p">AI Engineering / LLM Orchestration</text><text x="84.0" y="306" font-size="15" class="s">Agents in production</text><line x1="84.0" y1="330" x2="552.0" y2="330" class="hair"/><text x="84.0" y="356" font-size="17" font-weight="600" class="p">Software Architecture</text><text x="84.0" y="380" font-size="15" class="s">ERP, traceability, enterprise platforms</text><line x1="84.0" y1="404" x2="552.0" y2="404" class="hair"/><text x="84.0" y="430" font-size="17" font-weight="600" class="p">Consulting</text><text x="84.0" y="454" font-size="15" class="s">PostgreSQL-backed Node and React systems</text>
  <g filter="url(#shadow)"><rect x="612.0" y="110" width="540.0" height="396" rx="28" class="glass"/></g><clipPath id="g5"><rect x="612.0" y="110" width="540.0" height="396" rx="28"/></clipPath><g clip-path="url(#g5)"><g class="tint" filter="url(#softer)" transform="translate(612.0 110)"><circle class="drift1" cx="97" cy="99" r="146" fill="#7ab8ff"/><circle class="drift2" cx="432" cy="119" r="136" fill="#c3a6ff"/><circle class="drift3" cx="335" cy="376" r="126" fill="#f7b8d2"/><circle class="drift2" cx="54" cy="376" r="107" fill="#8fe3d2"/></g></g>
  <rect x="612.0" y="110" width="540.0" height="396" rx="28" fill="url(#sheen)"/>
  <rect x="612.5" y="110.5" width="539.0" height="395" rx="28" class="rim"/>
  <rect x="612.6" y="110.6" width="538.8" height="394.8" rx="28" class="edge"/><text x="648.0" y="162" font-size="22" font-weight="600" letter-spacing="-0.4" class="p">Problems I like</text><line x1="648.0" y1="182" x2="1116.0" y2="182" class="hair"/><text x="648.0" y="208" font-size="17" font-weight="600" class="p">Enterprise systems</text><text x="648.0" y="232" font-size="15" class="s">ERPs, dashboards, SaaS, traceability</text><line x1="648.0" y1="256" x2="1116.0" y2="256" class="hair"/><text x="648.0" y="282" font-size="17" font-weight="600" class="p">AI-powered apps</text><text x="648.0" y="306" font-size="15" class="s">Agentic automation, RAG, decision support</text><line x1="648.0" y1="330" x2="1116.0" y2="330" class="hair"/><text x="648.0" y="356" font-size="17" font-weight="600" class="p">Developer tooling</text><text x="648.0" y="380" font-size="15" class="s">Type-safe APIs, libraries, CI/CD</text><line x1="648.0" y1="404" x2="1116.0" y2="404" class="hair"/><text x="648.0" y="430" font-size="17" font-weight="600" class="p">Open source</text><text x="648.0" y="454" font-size="15" class="s">The TypeScript and PostgreSQL ecosystem</text>
</svg>
